[project]
name = "polyfinder"
version = "0.1.0"
description = "Polymarket profile finder & analyzer toolkit"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pandas>=2.2",
    "rich>=13.7",
    "sqlite-utils>=3.36",
    "gql[httpx]>=3.5",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyfinder"]

[tool.ruff]
line-length = 110
target-version = "py310"
